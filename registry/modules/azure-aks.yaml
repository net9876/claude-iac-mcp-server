name: azure-aks
display_name: Azure Kubernetes Service (AVM)
category: compute
status: approved
kind: avm
source: Azure/avm-res-containerservice-managedcluster/azurerm
version: "0.6.1"
registry_url: https://registry.terraform.io/modules/Azure/avm-res-containerservice-managedcluster/azurerm/latest
# References its RG via parent_id (the RG resource ID).
rg_ref: parent_id
supports_tags: true
required_inputs: [name, location, parent_id]
description: >
  AKS managed cluster from Azure Verified Modules. Defaults to a system node pool of
  three nodes. For org compliance, keep the API server private and use Entra ID RBAC
  (SEC-NET-001).
key_inputs:
  - "name (string, required) — abbr: aks"
  - "location (string, required)"
  - "parent_id (string, required) — the resource group resource_id"
  - "tags (map(string)) — MANDATORY by org standard"
outputs:
  - name: resource_id
    description: "AKS cluster resource ID."
example: |
  module "aks" {
    source  = "Azure/avm-res-containerservice-managedcluster/azurerm"
    version = "0.6.1"

    name      = "acme-prod-payments-aks01"
    location  = "westeurope"
    parent_id = module.resource_group.resource_id
    tags      = local.common_tags
  }
