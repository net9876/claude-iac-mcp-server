name: azure-resource-group
display_name: Azure Resource Group (AVM)
category: foundation
status: approved
kind: avm
source: Azure/avm-res-resources-resourcegroup/azurerm
version: "0.4.0"
registry_url: https://registry.terraform.io/modules/Azure/avm-res-resources-resourcegroup/azurerm/latest
# How this module references its resource group. It IS the RG, so: none.
rg_ref: none
supports_tags: true
required_inputs: [name, location]
description: >
  Foundational resource group, from Azure Verified Modules. Every workload starts
  with exactly one. Its `resource_id` output is the `parent_id` for storage/vnet/aks;
  its `name` output is the `resource_group_name` for key vault/postgres.
key_inputs:
  - "name (string, required) — must match the org naming standard (abbr: rg)"
  - "location (string, required) — must be an approved region"
  - "tags (map(string)) — optional in AVM, MANDATORY by org standard"
outputs:
  - name: resource_id
    description: "Full RG resource ID. Use as parent_id for child resources."
  - name: name
    description: "RG name. Use as resource_group_name for KV/Postgres."
example: |
  module "resource_group" {
    source  = "Azure/avm-res-resources-resourcegroup/azurerm"
    version = "0.4.0"

    name     = "acme-prod-payments-rg01"
    location = "westeurope"
    tags     = local.common_tags
  }
